  <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
    <path d="M11.3 50.7C11.7 49.4 12.7 48.8 13.9 48.8C15.3 48.8 16 49.6 16 51V56.3"/>
